<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>ATIG — Чат</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f; --surface: #161616; --surface-2: #1e1e1e;
  --border: #2a2a2a; --text: #e8e6e1; --text-muted: #888;
  --text-dim: #555; --accent: #d4a853;
  --accent-soft: rgba(212,168,83,0.12);
  --success: #4ade80; --error: #f87171;
  --font-body: 'DM Sans', sans-serif;
  --font-display: 'Instrument Serif', serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 800px; margin: 0 auto; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #222; flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; background: linear-gradient(135deg, #d4a853, #b8892e); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 13px; color: #0a0a0a; }
.logo-name { font-family: var(--font-display); font-size: 18px; }
.logo-ver { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
.header-right { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); animation: pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
.btn-icon { width: 34px; height: 34px; background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 2px; }
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 60px 24px; text-align: center; flex: 1; }
.welcome-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #d4a853, #b8892e); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 22px; color: #0a0a0a; }
.welcome h1 { font-family: var(--font-display); font-size: 28px; font-weight: 400; }
.welcome p { font-size: 14px; color: var(--text-muted); max-width: 320px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.suggestion { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.message-row { display: flex; flex-direction: column; animation: slideUp 0.2s ease; padding: 4px 0; }
.message-row.user { align-items: flex-end; }
.message-row.assistant { align-items: flex-start; }
@keyframes slideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.message-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-family: var(--font-mono); padding: 0 4px; }
.message-bubble { max-width: min(85%,600px); padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.65; word-break: break-word; }
.message-row.user .message-bubble { background: #1a1a1a; border: 1px solid var(--border); border-bottom-right-radius: 4px; }
.message-row.assistant .message-bubble { background: transparent; border-bottom-left-radius: 4px; padding-left: 0; }
.message-bubble code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--accent); }
.message-bubble pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; margin: 10px 0; font-family: var(--font-mono); font-size: 13px; }
.message-bubble pre code { background: none; padding: 0; color: var(--text); }
.message-bubble p { margin: 6px 0; }
.message-bubble p:first-child { margin-top: 0; }
.message-bubble p:last-child { margin-bottom: 0; }
.message-bubble ul, .message-bubble ol { padding-left: 20px; margin: 6px 0; }
.thinking { display: flex; align-items: center; gap: 8px; padding: 12px 4px; color: var(--text-dim); font-size: 13px; }
.dots { display: flex; gap: 4px; }
.dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:0.2s} .dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }
.actions-used { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.action-tag { font-size: 11px; font-family: var(--font-mono); color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(212,168,83,0.2); padding: 2px 8px; border-radius: 10px; }
.input-area { padding: 12px 16px 16px; border-top: 1px solid #222; flex-shrink: 0; }
.input-wrapper { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; transition: border-color 0.2s; }
.input-wrapper:focus-within { border-color: var(--accent); }
#messageInput { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; resize: none; max-height: 160px; min-height: 24px; }
#messageInput::placeholder { color: var(--text-dim); }
.send-btn { width: 34px; height: 34px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #0a0a0a; transition: all 0.15s; }
.send-btn:hover { background: #e0b55f; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.input-hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; }
@media(max-width:600px) { .messages{padding:16px} .input-area{padding:10px 12px 14px} .message-bubble{max-width:92%} }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-mark">AI</div>
      <div>
        <div class="logo-name">ATIG</div>
        <div class="logo-ver">v2.0 · autonomous</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-dot" id="statusDot"></div>
      <button class="btn-icon" onclick="clearChat()">🗑</button>
    </div>
  </header>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">AI</div>
      <h1>Привет, я ATIG</h1>
      <p>Твой автономный цифровой компаньон. Просто напиши.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion(this)">Который сейчас час?</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Расскажи о себе</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Найди новости об ИИ</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Посчитай 2^32</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Что ты умеешь?</div>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="Напиши ATIG что-нибудь..." rows="1" autofocus></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-hint">Enter — отправить · Shift+Enter — новая строка</div>
  </div>
</div>
<script>
let ws = null, isThinking = false, thinkingEl = null;

// ПРОВЕРЯЕМ, ЕСТЬ ЛИ СЕССИЯ В ПАМЯТИ БРАУЗЕРА
let sessionId = localStorage.getItem('atig_session_id');

if (!sessionId) {
    // Если нет, создаем новую и сохраняем навсегда
    sessionId = 'session_' + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('atig_session_id', sessionId);
}
 ws.onmessage=(e)=>handleMessage(JSON.parse(e.data));
  ws.onclose=()=>{setStatus(false);setTimeout(connect,3000)};
  ws.onerror=()=>setStatus(false);
}
function setStatus(online){
  const d=document.getElementById('statusDot');
  d.style.background=online?'var(--success)':'var(--error)';
  d.style.boxShadow=online?'0 0 6px var(--success)':'0 0 6px var(--error)';
}
function handleMessage(data){
  removeThinking();
  if(data.type==='thinking'){showThinking();return;}
  if(data.type==='error'){addMessage('assistant','⚠️ '+data.content,[]);return;}
  if(data.type==='message'){addMessage('assistant',data.content,data.actions||[]);setInputEnabled(true);isThinking=false;}
}
function addMessage(role,content,actions){
  hideWelcome();
  const row=document.createElement('div');
  row.className=`message-row ${role}`;
  const label=document.createElement('div');
  label.className='message-label';
  label.textContent=role==='user'?'Вы':'ATIG';
  row.appendChild(label);
  const bubble=document.createElement('div');
  bubble.className='message-bubble';
  bubble.innerHTML=formatMessage(content);
  row.appendChild(bubble);
  if(actions&&actions.length>0){
    const el=document.createElement('div');
    el.className='actions-used';
    actions.forEach(a=>{const t=document.createElement('span');t.className='action-tag';t.textContent=`⚙ ${a.tool}`;el.appendChild(t);});
    row.appendChild(el);
  }
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}
function formatMessage(text){
  text=text.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${escHtml(c.trim())}</code></pre>`);
  text=text.replace(/`([^`]+)`/g,'<code>$1</code>');
  text=text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  text=text.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  text=text.replace(/^- (.+)$/gm,'<li>$1</li>');
  text=text.split('\n\n').map(p=>p.startsWith('<')?p:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  return text;
}
function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showThinking(){
  const msgs=document.getElementById('messages');
  thinkingEl=document.createElement('div');
  thinkingEl.className='thinking';
  thinkingEl.innerHTML='<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span>ATIG думает...</span>';
  msgs.appendChild(thinkingEl);
  scrollToBottom();
}
function removeThinking(){if(thinkingEl){thinkingEl.remove();thinkingEl=null;}}
function hideWelcome(){const w=document.getElementById('welcome');if(w)w.remove();}
function scrollToBottom(){const m=document.getElementById('messages');m.scrollTop=m.scrollHeight;}
function sendMessage(){
  const input=document.getElementById('messageInput');
  const text=input.value.trim();
  if(!text||isThinking)return;
  if(!ws||ws.readyState!==WebSocket.OPEN){return;}
  addMessage('user',escHtml(text),[]);
  input.value='';
  autoResize();
  ws.send(JSON.stringify({message:text,session_id:sessionId}));
  isThinking=true;
  setInputEnabled(false);
}
function sendSuggestion(el){document.getElementById('messageInput').value=el.textContent;sendMessage();}
function setInputEnabled(e){document.getElementById('sendBtn').disabled=!e;document.getElementById('messageInput').disabled=!e;if(e)document.getElementById('messageInput').focus();}
async function clearChat(){
  if(!confirm('Очистить историю?'))return;
  try{await fetch(`/api/history?session_id=${sessionId}`,{method:'DELETE'});}catch{}
  document.getElementById('messages').innerHTML='<div class="welcome" id="welcome"><div class="welcome-icon">AI</div><h1>Начнём заново?</h1></div>';
}
function autoResize(){const el=document.getElementById('messageInput');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';}
document.getElementById('messageInput').addEventListener('input',autoResize);
document.getElementById('messageInput').addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
connect();
setInputEnabled(true);
</script>
</body>
</html>
