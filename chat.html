<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ATIG — Голосовой чат</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f; --surface: #161616; --surface-2: #1e1e1e;
  --border: #2a2a2a; --text: #e8e6e1; --text-muted: #888;
  --accent: #d4a853;
  --success: #4ade80; --error: #f87171;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); height: 100vh; overflow: hidden; }
.app { display: flex; flex-direction: column; height: 100%; max-width: 800px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #222; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #0a0a0a; font-weight: bold; }
.status { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.status-text { font-size: 12px; color: var(--text-muted); }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.welcome { text-align: center; padding: 60px 20px; }
.welcome-icon { font-size: 48px; margin-bottom: 16px; }
.welcome h2 { margin-bottom: 8px; font-weight: 400; }
.welcome p { color: var(--text-muted); margin-bottom: 20px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
.suggestion { padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.suggestion:hover { border-color: var(--accent); color: var(--accent); }
.message-row { display: flex; flex-direction: column; margin-bottom: 16px; }
.message-row.user { align-items: flex-end; }
.message-row.assistant { align-items: flex-start; }
.message-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; font-family: var(--font-mono); }
.message-bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
.message-row.user .message-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
.message-row.assistant .message-bubble { background: transparent; border-bottom-left-radius: 4px; }
.thinking { display: flex; align-items: center; gap: 8px; padding: 10px; color: var(--text-muted); }
.dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.input-area { padding: 16px; border-top: 1px solid #222; }
.input-wrapper { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 8px 12px; }
#messageInput { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 14px; resize: none; min-height: 36px; }
.send-btn, .mic-btn { width: 36px; height: 36px; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.send-btn { background: var(--accent); color: #0a0a0a; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mic-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); font-size: 16px; }
.mic-btn:hover { border-color: var(--accent); color: var(--accent); }
.mic-btn.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
.input-hint { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 8px; display: flex; gap: 16px; justify-content: center; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-mark">AI</div>
      <div>ATIG · voice</div>
    </div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">онлайн</span>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🧠</div>
      <h2>Привет, я ATIG</h2>
      <p>Твой цифровой компаньон. Говори или пиши.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion(this)">Который сейчас час?</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Расскажи о себе</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Что ты умеешь?</div>
        <div class="suggestion" onclick="sendSuggestion(this)">Посчитай 2+2</div>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="Напиши или скажи..." rows="1"></textarea>
      <button class="mic-btn" id="micBtn" title="Голосовой ввод">🎤</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
    </div>
    <div class="input-hint">
      <span>🎤 микрофон</span>
      <span>⌨ Enter — отправить</span>
      <span>🔊 ATIG говорит</span>
    </div>
  </div>
</div>

<script>
// === ГОЛОС ===
let speechSynth = window.speechSynthesis;
let isListening = false;
let recognition = null;

function speakResponse(text) {
  if (!text || !speechSynth) return;
  let cleanText = text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/`/g, '').replace(/```[\s\S]*?```/g, '');
  if (cleanText.length > 500) cleanText = cleanText.substring(0, 500);
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'ru-RU';
  utterance.rate = 0.9;
  utterance.pitch = 1.05;
  speechSynth.cancel();
  speechSynth.speak(utterance);
}

// === ОСНОВНОЙ ЧАТ ===
let ws = null, isThinking = false, thinkingEl = null;
let sessionId = localStorage.getItem('atig_session_id') || 'atig_' + Math.random().toString(36).substring(2, 10);
localStorage.setItem('atig_session_id', sessionId);

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/chat`);
  ws.onopen = () => {
    document.getElementById('statusDot').style.background = '#4ade80';
    document.getElementById('statusText').textContent = 'онлайн';
  };
  ws.onclose = () => {
    document.getElementById('statusDot').style.background = '#f87171';
    document.getElementById('statusText').textContent = 'переподключение...';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => {
    document.getElementById('statusDot').style.background = '#f87171';
    document.getElementById('statusText').textContent = 'ошибка';
  };
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleMessage(data);
  };
}

function handleMessage(data) {
  removeThinking();
  if (data.type === 'thinking') { showThinking(); return; }
  if (data.type === 'error') {
    addMessage('assistant', '⚠️ ' + data.content);
    setInputEnabled(true);
    isThinking = false;
    return;
  }
  if (data.type === 'message') {
    addMessage('assistant', data.content);
    // Озвучиваем ответ
    speakResponse(data.content);
    setInputEnabled(true);
    isThinking = false;
  }
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const messages = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = `message-row ${role}`;
  const label = document.createElement('div');
  label.className = 'message-label';
  label.textContent = role === 'user' ? 'Вы' : 'ATIG';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.innerHTML = formatMessage(content);
  row.appendChild(label);
  row.appendChild(bubble);
  messages.appendChild(row);
  messages.scrollTop = messages.scrollHeight;
}

function formatMessage(text) {
  let t = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre><code>${escapeHtml(c.trim())}</code></pre>`);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text || isThinking) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    addMessage('assistant', '⚠️ Соединение теряется. Подождите...');
    return;
  }
  addMessage('user', text);
  input.value = '';
  autoResize();
  ws.send(JSON.stringify({ message: text, session_id: sessionId }));
  isThinking = true;
  setInputEnabled(false);
}

function sendSuggestion(el) {
  document.getElementById('messageInput').value = el.textContent;
  sendMessage();
}

function setInputEnabled(enabled) {
  document.getElementById('sendBtn').disabled = !enabled;
  document.getElementById('messageInput').disabled = !enabled;
  if (enabled) document.getElementById('messageInput').focus();
}

function showThinking() {
  removeThinking();
  const messages = document.getElementById('messages');
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking';
  thinkingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div><span>ATIG думает...</span>';
  messages.appendChild(thinkingEl);
  messages.scrollTop = messages.scrollHeight;
}

function removeThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function autoResize() {
  const el = document.getElementById('messageInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// === ГОЛОСОВОЙ ВВОД ===
const micBtn = document.getElementById('micBtn');

function startVoiceInput() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert("Ваш браузер не поддерживает голосовой ввод");
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('active');
    micBtn.textContent = '🔴';
  };

  recognition.onresult = (event) => {
    const voiceText = event.results[0][0].transcript;
    document.getElementById('messageInput').value = voiceText;
    sendMessage();
  };

  recognition.onerror = (event) => {
    console.error('Ошибка:', event.error);
    micBtn.classList.remove('active');
    micBtn.textContent = '🎤';
    isListening = false;
    if (event.error !== 'aborted') {
      addMessage('assistant', '⚠️ Не удалось распознать голос. Попробуйте ещё раз.');
    }
  };

  recognition.onend = () => {
    micBtn.classList.remove('active');
    micBtn.textContent = '🎤';
    isListening = false;
    recognition = null;
  };

  recognition.start();
}

micBtn.addEventListener('click', () => {
  if (isListening) {
    if (recognition) recognition.abort();
  } else {
    startVoiceInput();
  }
});

// === ИНИЦИАЛИЗАЦИЯ ===
document.getElementById('messageInput').addEventListener('input', autoResize);
document.getElementById('messageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

connect();
setInputEnabled(true);
</script>
</body>
</html>
